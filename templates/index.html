        <div class=" col-12 col-md-12 ii">
          <div class="input-area">
            <div class="tools">

              <div class="prompt-dropdown">
                <button class="btn btn-primary btn-sm" id="skillToggle" title="Select Skill">
                  ✦ <span id="skillToggleLabel"  style="padding-left:4px;">Default</span>
                </button>
                <div class="prompt-menu overflow-y-auto overflow-x-hidden" id="skillMenu" style="max-height: 400px;">
                  <div class="prompt-loading">Loading...</div>
                </div>
                <!-- 隐藏的原生 select，作为技能选择的数据源，供其余脚本（chat.js / prompt.js）读取/写入，
                     保证不改动既有逻辑的前提下，仅替换外观为与"提示词"一致的按钮+菜单样式 -->
                <select id="skill" style="display:none;">
                  <option value="" selected>None</option>
                </select>
              </div>



              <div class="prompt-dropdown">
                <button class="btn btn-primary btn-sm" id="promptToggle" title="Prompt Presets">
                  ≡ <span id="skillToggleLabel"  style="padding-left:4px;">Prompts</span>
                </button>
                <div class="prompt-menu overflow-y-auto overflow-x-hidden" id="promptMenu" style="max-height: 400px;">
                  <div class="prompt-loading">Loading...</div>
                </div>
              </div>

              <div class="chooseimg" id="chooseimg">
                <input type="file" id="fileUpload"
                  accept="image/*,.pdf,.txt,.md,.markdown,.docx,.js,.py,.json,.csv,.log,.html,.htm,.xml" multiple />
                <label for="fileUpload" class="btn btn-primary btn-sm" title="Upload Image/Document">
                  ❏ <span id="skillToggleLabel"  style="padding-left:4px;">Upload Files</span>
                </label>
              </div>





              <style>
                .element-hidden {
                  position: absolute !important;
                  width: 1px !important;
                  height: 1px !important;
                  padding: 0 !important;
                  margin: -1px !important;
                  overflow: hidden !important;
                  clip: rect(0, 0, 0, 0) !important;
                  white-space: nowrap !important;
                  border-width: 0 !important;
                }
                /* 所有参数（数量/种子/比例/画风等）都由所选技能 config.json 里的
                   custom_params 动态生成。.param-item 用 display:contents
                   包裹 label+input，自身不参与布局，和输入框共享同一行 flex 布局 */
                .param-item {
                  display: contents;
                }
              </style>
              <div class="params-row">
                <input type="text" id="tupianbx" maxlength="200" style="width:0px; display:none;">

                <!-- 所有参数（数量/种子/比例/画风等）都由所选技能 config.json 里的
                     custom_params 数组动态生成（key / label / type 均可自由定义），
                     出现在 custom_params 里才会显示。display:contents 让它们共享
                     同一行 flex 布局。由 prompt.js 的 renderCustomParams() 渲染 -->
                <span id="customParamsRow" style="display:contents;"></span>
              </div>

            </div>

            <p id="yinyonidtgw" class="noshow">
              <i class="bi bi-arrow-return-right"></i>
              <span id="yinyonidtg"></span>
            </p>




            <div class="compose-row">
              <textarea id="userInput" placeholder="Type your instructions... (Enter to send, Shift+Enter for a new line)" rows="3"
                ></textarea>
              <button class="send-btn" id="sendButton" title="Send (Enter)">
                <span>➤<span>
              </button>
            </div>

            <div id="imagePreviewContainer"></div>
            <div id="documentPreviewContainer"></div>
    
            <script>

              const container = document.getElementById('imagePreviewContainer');

              function updateScrollMode() {
                console.log(container.scrollWidth)

                if (container.scrollWidth > 600) {
                  container.classList.add('scrollable');
                } else {
                  container.classList.remove('scrollable');
                }
              }

              const resizeObserver = new ResizeObserver(() => {
                updateScrollMode();
              });
              resizeObserver.observe(container);

              const mutationObserver = new MutationObserver(() => {
                updateScrollMode();
              });
              mutationObserver.observe(container, { childList: true, subtree: false });

              updateScrollMode();

            </script>
          </div>
